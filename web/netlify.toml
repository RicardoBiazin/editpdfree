# EditPDFree (web) no Netlify: site estatico + uma Edge Function (o portao
# anti-robo). O PDF nunca passa pelo servidor: tudo roda no navegador.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Portao anti-robo: prova de trabalho + cookie assinado (ver README).
# Precisa da variavel PORTAO_SEGREDO no painel do Netlify.
[[edge_functions]]
  function = "portao"
  path = "/*"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self'; font-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Strict-Transport-Security = "max-age=31536000"
    X-Robots-Tag = "noindex, nofollow"

# Arquivos com hash no nome nunca mudam.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=31536000, immutable"

# O service worker e a pagina precisam ser conferidos a cada visita, senao a
# versao nova nunca chega.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# OCR (tesseract.js): baixado so' no primeiro uso. Os idiomas ja' vem em
# .gz e o tesseract os descompacta sozinho: sem Content-Encoding aqui.
[[headers]]
  for = "/ocr/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/ocr/lang/*"
  [headers.values]
    Content-Type = "application/octet-stream"
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
